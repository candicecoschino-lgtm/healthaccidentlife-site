<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thank You | Health Accident Life</title>

  <meta
    name="description"
    content="Thank you for requesting a coverage review from Health Accident Life."
  />

  <link rel="stylesheet" href="/css/style.css" />

  <style>
    .thank-you-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #f8f9fa;
    }

    .thank-you-card {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 31, 63, 0.12);
      border: 1px solid #e8eaed;
    }

    .thank-you-card img {
      max-width: 260px;
      width: 100%;
      height: auto;
      margin-bottom: 30px;
    }

    .thank-you-card h1 {
      color: #001f3f;
      font-size: 42px;
      line-height: 1.15;
      margin: 0 0 20px;
    }

    .thank-you-card p {
      color: #5f6368;
      font-size: 17px;
      line-height: 1.7;
      margin: 0 auto 18px;
      max-width: 590px;
    }

    .thank-you-card .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      padding: 15px 28px;
      background: #0074d9;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
    }

    .thank-you-card .primary-button:hover {
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .thank-you-card {
        padding: 40px 24px;
      }

      .thank-you-card h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="thank-you-section">

    <section class="thank-you-card">

      <img
        src="/images/logo.png"
        alt="Health Accident Life"
      />

      <h1>Your request was received.</h1>

      <p>
        Thank you for requesting a coverage review.
        A licensed insurance advisor will review your information
        and reach out to discuss available options.
      </p>

      <p>
        Product availability, eligibility, benefits, and pricing
        vary by state, carrier, and individual circumstances.
      </p>

      <a href="/" class="primary-button">
        Back to Home
      </a>

    </section>

  </main>

</body>
</html>
